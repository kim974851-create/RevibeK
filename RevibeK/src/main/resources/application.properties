spring.application.name=RevibeK
spring.profiles.include=secret
# MVP/local defaults. Override secrets with environment variables or
# application-secret.properties in real deployments.
# dataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kpop_radio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:SSAFY}
spring.datasource.password=${DB_PASSWORD:SSAFY}
# mybatis
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.ssafy.revibek
mybatis.configuration.map-underscore-to-camel-case=true
# security
spring.security.user.name=admin
spring.security.user.password=1234
# jwt
jwt.secret=${JWT_SECRET:revibek-local-development-secret-32bytes}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000
# oauth2 google
app.oauth.google.enabled=${APP_OAUTH_GOOGLE_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:revibek-local-google-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:revibek-local-google-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
# youtube
youtube.api.key=${YOUTUBE_API_KEY:}
# FastAPI is optional for the presentation MVP. Enable explicitly when the
# Python project and dependencies are available.
app.fastapi.enabled=${APP_FASTAPI_ENABLED:false}
app.fastapi.fallback=${APP_FASTAPI_FALLBACK:mock}
fastapi.launcher.enabled=${FASTAPI_LAUNCHER_ENABLED:false}
# qdrant
app.qdrant.enabled=${APP_QDRANT_ENABLED:false}
app.qdrant.fallback=${APP_QDRANT_FALLBACK:score}
# email verification
app.email.verification.mode=${APP_EMAIL_VERIFICATION_MODE:mock}
app.email.verification.mock-code=${APP_EMAIL_VERIFICATION_MOCK_CODE:123456}
# refresh token store
app.refresh-token.store=${APP_REFRESH_TOKEN_STORE:memory}
# smtp mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# gms claude
gms.api.base-url=${GMS_API_BASE_URL:https://gms.ssafy.io/gmsapi/api.anthropic.com/v1/messages}
gms.api.key=${GMS_KEY:}
gms.api.anthropic-version=2023-06-01
gms.api.model=claude-sonnet-4-6
gms.api.max-tokens=300
gms.api.budget-credit=30
gms.api.input-cost-per-1k=0.03
gms.api.output-cost-per-1k=0.15
# google cloud text-to-speech
gcp.tts.base-url=${GCP_TTS_BASE_URL:https://texttospeech.googleapis.com/v1}
gcp.tts.api-key=${GCP_TTS_API_KEY:}
gcp.tts.default-language-code=ko-KR
gcp.tts.default-voice-name=ko-KR-Chirp3-HD-Vindemiatrix
gcp.tts.default-audio-encoding=MP3
gcp.tts.default-speaking-rate=1.0
gcp.tts.default-pitch=0.0

